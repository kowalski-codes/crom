<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hush Hush</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --phosphor: #7e9481;
      --phosphor-dim: #5a6e5d;
      --phosphor-bright: #96ab99;
      --bg: #232826;
      --bar-bg: #1e2321;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--phosphor);
      font-family: 'VT323', monospace;
      font-size: 21px;
      line-height: 1.35;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top Status Bar */
    header {
      background: var(--bar-bg);
      border-bottom: 1px solid var(--phosphor-dim);
      padding: 6px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-transform: uppercase;
      font-size: 16px;
      letter-spacing: 1px;
      z-index: 10;
    }

    #clock {
      font-size: 13px;
      color: var(--phosphor-dim);
      letter-spacing: 0.5px;
    }

    /* Centered Darknet Box (Password & Lockout) */
    #center-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid var(--phosphor-dim);
      padding: 24px 32px;
      background: var(--bg);
      text-align: center;
      min-width: 380px;
      max-width: 90%;
      z-index: 20;
    }

    #center-overlay.hidden {
      display: none;
    }

    .box-title {
      color: var(--phosphor-bright);
      font-size: 22px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .box-body {
      color: var(--phosphor);
      font-size: 19px;
      line-height: 1.4;
      white-space: pre-line;
    }

    .box-danger {
      color: #9c6060;
    }

    /* Main Terminal Log */
    #terminal {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      word-break: break-word;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #terminal::-webkit-scrollbar {
      width: 6px;
    }
    #terminal::-webkit-scrollbar-thumb {
      background: var(--phosphor-dim);
    }

    /* Messages & Logs */
    .msg-row {
      display: flex;
      gap: 8px;
    }
    .msg-text {
      white-space: pre-wrap;
    }
    .ts {
      color: var(--phosphor-dim);
      white-space: nowrap;
    }
    .user-self {
      color: var(--phosphor-bright);
      font-weight: bold;
      white-space: nowrap;
    }
    .user-peer {
      color: var(--phosphor);
      white-space: nowrap;
    }
    .sys-msg {
      color: var(--phosphor-dim);
      font-style: italic;
      white-space: pre-wrap;
    }
    .sys-err {
      color: #9c6060;
    }

    /* Bottom Command Prompt */
    #prompt-bar {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background: var(--bar-bg);
      border-top: 1px solid var(--phosphor-dim);
      z-index: 10;
    }

    #prompt-label {
      margin-right: 8px;
      white-space: nowrap;
    }

    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--phosphor-bright);
      font-family: 'VT323', monospace;
      font-size: 21px;
      caret-color: var(--phosphor);
    }

    #cmd-input:disabled {
      cursor: not-allowed;
    }
  </style>
  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <header>
    <span id="clock">--:--:--</span>
    <span id="header-user">SESSION: LOCKED</span>
  </header>

  <!-- Centered Darknet Box (Password & Lockout) -->
  <div id="center-overlay">
    <div id="box-title" class="box-title">[ ENCRYPTED RELAY NODE ]</div>
    <div id="box-body" class="box-body">WARNING: RESTRICTED CIPHERTEXT PROTOCOL.
UNAUTHORIZED HANDSHAKES LOGGED.
AUTHENTICATION ATTEMPTS REMAINING: 3</div>
  </div>

  <main id="terminal"></main>

  <footer id="prompt-bar">
    <span id="prompt-label">PASSWORD:</span>
    <input type="password" id="cmd-input" autocomplete="off" autofocus />
  </footer>

  <script>
    const SECRET_PASSWORD = "passwerd";
    let attemptsRemaining = 3;

    const firebaseConfig = {
      apiKey: "AIzaSyCb9xnEEylZwLDrSGtRJEX91T5pU_jTDwc",
      authDomain: "ccrom-7ba66.firebaseapp.com",
      databaseURL: "https://ccrom-7ba66-default-rtdb.firebaseio.com",
      projectId: "ccrom-7ba66",
      storageBucket: "ccrom-7ba66.firebasestorage.app",
      messagingSenderId: "608692639636",
      appId: "1:608692639636:web:4c08ce981c6fd983bce181",
      measurementId: "G-N0L6DS54RT"
    };

    let currentStep = "PASSWORD"; 
    let currentUser = "";
    let isInitialLoadDone = false;
    let isBooting = false;
    let db = null;
    let messagesRef = null;

    // Audio Assets
    const soundJoin = new Audio("join.mp3");
    const soundMsg = new Audio("msg.mp3");

    const terminal = document.getElementById("terminal");
    const input = document.getElementById("cmd-input");
    const promptLabel = document.getElementById("prompt-label");
    const headerUser = document.getElementById("header-user");
    const centerOverlay = document.getElementById("center-overlay");
    const boxTitle = document.getElementById("box-title");
    const boxBody = document.getElementById("box-body");

    // Helper: 24-hour military time
    function getMilitaryTime() {
      return new Date().toLocaleTimeString('en-GB', { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit', 
        hour12: false 
      });
    }

    // Real-time Header Clock
    function updateClock() {
      document.getElementById("clock").textContent = getMilitaryTime();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Promise-based Typewriter Function
    function typeTextPromise(targetElement, fullText, speed = 14) {
      return new Promise((resolve) => {
        let idx = 0;
        const interval = setInterval(() => {
          if (idx < fullText.length) {
            targetElement.textContent += fullText.charAt(idx);
            idx++;
            terminal.scrollTop = terminal.scrollHeight;
          } else {
            clearInterval(interval);
            resolve();
          }
        }, speed);
      });
    }

    // Static print for chat archives
    function writeLine(htmlContent, className = "") {
      const div = document.createElement("div");
      if (className) div.className = className;
      div.innerHTML = htmlContent;
      terminal.appendChild(div);
      terminal.scrollTop = terminal.scrollHeight;
      return div;
    }

    // Stream live message arrivals
    function streamLine(prefixHtml, textPayload, className = "") {
      const div = document.createElement("div");
      if (className) div.className = className;
      div.innerHTML = prefixHtml;
      const textSpan = document.createElement("span");
      textSpan.className = "msg-text";
      div.appendChild(textSpan);
      terminal.appendChild(div);
      typeTextPromise(textSpan, textPayload, 14);
    }

    // Sequential Boot & Loading Sequence (3-second handshake)
    async function startBootSequence() {
      isBooting = true;
      input.disabled = true;

      // Line 1: Registered Callsign
      const line1 = document.createElement("div");
      line1.className = "sys-msg";
      terminal.appendChild(line1);
      await typeTextPromise(line1, `[OK] CALLSIGN REGISTERED: ${currentUser}`);

      // Line 2: 3-Second Loading Animation
      const line2 = document.createElement("div");
      line2.className = "sys-msg";
      terminal.appendChild(line2);
      const baseText = "DECRYPTING ARCHIVES & CONNECTING TO LIVE CHANNEL";
      line2.textContent = baseText;

      let elapsed = 0;
      let dotCount = 0;
      await new Promise((resolve) => {
        const loadInterval = setInterval(() => {
          elapsed += 250;
          dotCount = (dotCount + 1) % 5;
          line2.textContent = baseText + ".".repeat(dotCount);
          if (elapsed >= 3000) {
            clearInterval(loadInterval);
            line2.textContent = baseText + "... [DONE]";
            resolve();
          }
        }, 250);
      });

      // Line 3: Direct to /help
      const line3 = document.createElement("div");
      line3.className = "sys-msg";
      terminal.appendChild(line3);
      await typeTextPromise(line3, "TYPE /help FOR AVAILABLE COMMAND DIRECTIVES.");

      // Line 4: Divider
      const line4 = document.createElement("div");
      line4.className = "sys-msg";
      terminal.appendChild(line4);
      await typeTextPromise(line4, "-------------------------------------------------");

      // Enable input & mount Firebase archives
      input.disabled = false;
      input.focus();
      isBooting = false;
      initFirebase();
    }

    // Input Handler & Command Parser
    input.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter") return;
      const val = input.value.trim();
      input.value = "";
      if (!val || isBooting) return;

      // STAGE 1: PASSWORD AUTHENTICATION (3 ATTEMPTS)
      if (currentStep === "PASSWORD") {
        if (val === SECRET_PASSWORD) {
          boxTitle.textContent = "[ IDENTITY ACCEPTED ]";
          boxBody.textContent = "ENTER OPERATOR CALLSIGN / HANDLE BELOW.";
          promptLabel.textContent = "CALLSIGN:";
          input.type = "text";
          currentStep = "USERNAME";
        } else {
          attemptsRemaining--;
          if (attemptsRemaining > 0) {
            boxBody.textContent = `WARNING: RESTRICTED CIPHERTEXT PROTOCOL.\nUNAUTHORIZED HANDSHAKES LOGGED.\nAUTHENTICATION ATTEMPTS REMAINING: ${attemptsRemaining}`;
          } else {
            // Permanent Lockout Protocol
            boxTitle.textContent = "TERMINAL HALTED";
            boxTitle.classList.add("box-danger");
            boxBody.textContent = "GOODBYE.\nCONNECTION SEVERED.";
            boxBody.classList.add("box-danger");
            promptLabel.textContent = "[HALTED]";
            input.disabled = true;
          }
        }
        return;
      }

      // STAGE 2: HANDLE / IDENTITY
      if (currentStep === "USERNAME") {
        currentUser = val.toUpperCase();
        headerUser.textContent = `CALLSIGN: ${currentUser}`;
        centerOverlay.classList.add("hidden");
        promptLabel.textContent = `${currentUser}>`;
        currentStep = "CHAT";

        // Play Joining Lobby Sound
        soundJoin.play().catch(() => {});

        // Begin loading sequence before archives load
        startBootSequence();
        return;
      }

      // STAGE 3: LIVE TRANSMISSION & COMMANDS
      if (currentStep === "CHAT") {
        // Command: /clear
        if (val === "/clear") {
          terminal.innerHTML = "";
          writeLine("TERMINAL BUFFER CLEARED. ARCHIVES REMAIN IN DATABASE.", "sys-msg");
          return;
        }

        // Command: /purge
        if (val === "/purge") {
          if (confirm("WARNING: Purge will permanently delete all shared logs. Continue?")) {
            if (messagesRef) {
              await messagesRef.remove();
              terminal.innerHTML = "";
              writeLine("ALL ARCHIVED LOGS HAVE BEEN PERMANENTLY PURGED.", "sys-err");
            }
          }
          return;
        }

        // Command: /whoami
        if (val === "/whoami") {
          writeLine(`CURRENT OPERATOR: ${currentUser}`, "sys-msg");
          return;
        }

        // Command: /help (Aligned Terminal Manual)
        if (val === "/help") {
          const helpManual = 
`======================= COMMAND DIRECTIVES =======================
  COMMAND    DESCRIPTION
  -------    -----------
  /help      Display terminal manual & directives
  /clear     Flush local terminal screen buffer
  /whoami    Display active operator handle
  /purge     Permanently erase all archived logs from cloud
==================================================================`;
          writeLine(helpManual, "sys-msg");
          return;
        }

        // Transmit Message to Firebase
        if (messagesRef) {
          messagesRef.push({
            user: currentUser,
            text: val,
            time: getMilitaryTime()
          });
        }
      }
    });

    // Firebase Connection & Sync
    function initFirebase() {
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
        messagesRef = db.ref("chat_logs");

        // Backlog load detection
        messagesRef.once("value", () => {
          isInitialLoadDone = true;
        });

        // Listen for all messages
        messagesRef.on("child_added", (snapshot) => {
          const data = snapshot.val();
          if (!data) return;

          const isSelf = data.user === currentUser;
          const userClass = isSelf ? "user-self" : "user-peer";
          const prefix = `<span class="ts">[${data.time}]</span> <span class="${userClass}">&lt;${data.user}&gt;</span> `;

          if (!isInitialLoadDone) {
            // Render past messages instantly once handshake finishes
            writeLine(`${prefix}<span class="msg-text">${escapeHtml(data.text)}</span>`, "msg-row");
          } else {
            // Play notification tone on real-time peer messages
            if (!isSelf) {
              soundMsg.play().catch(() => {});
            }
            // Stream new messages using typewriter effect
            streamLine(prefix, data.text, "msg-row");
          }
        });

      } catch (err) {
        writeLine("[RELAY ERROR]: UNABLE TO CONNECT TO REALTIME CLOUD.", "sys-err");
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Keep focus inside terminal input on click unless halted or booting
    document.addEventListener("click", () => {
      if (!input.disabled && !isBooting) {
        input.focus();
      }
    });
  </script>
</body>
</html>
